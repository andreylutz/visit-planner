<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Visit Planner</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <article class="event-card">
        <h1 id="event-title">Ночь в музее</h1>

        <p>15 ноября, 18:30</p>
        <p>Музей космонавтики, проспект Мира, 111</p>
        <p>Вечерняя программа с выставкой и экскурсиями</p>

        <button id="show-program" type="button">Показать программу</button>

        <div id="program" hidden></div>
      </article>

      <form id="service-form" class="service-form" hidden>
        <h2>Дополнительные услуги</h2>

        <label>
          <input type="checkbox" id="guide" />
          Экскурсия с гидом — 500 руб.
        </label>

        <label>
          <input type="checkbox" id="audio" />
          Аудиогид — 350 руб.
        </label>

        <label>
          <input type="checkbox" id="catalog" />
          Каталог выставки — 250 руб.
        </label>

        <button type="submit">Рассчитать стоимость</button>
      </form>

      <p id="choice-error" class="error-message" hidden></p>
      <p id="data-error" class="error-message" hidden></p>

      <div id="result" class="result" hidden></div>
      <pre id="report-json" class="json-report" hidden></pre>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
